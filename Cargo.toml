[package]
name = "dashboard"
version = "0.1.0"
edition = "2021"
license = "AGPL-v3"
description = "Percy dashboard — standalone web binary (skeleton) built on the shared klappstuhl.me kernel."

# The three shared crates come from the klappstuhl_me-shared repo as a
# tag-pinned git dependency (see DASHBOARD_DECOUPLING_PLAN.md, Phase 5) — the
# same pin the main klappstuhl_me site uses, so both apps share one design/auth/
# API-client foundation. Bump the tag in lock-step with klappstuhl_me.
[dependencies]
anyhow = "1.0.80"
askama = { version = "0.12.1", features = ["with-axum"] }
askama_axum = "0.4.0"
axum = "0.7.4"
dirs = "5.0.1"
kls-ui = { git = "ssh://git@github.com/klappstuhlpy/klappstuhl_me-shared", tag = "v0.1.1" }
kls-web-core = { git = "ssh://git@github.com/klappstuhlpy/klappstuhl_me-shared", tag = "v0.1.1" }
percy-client = { git = "ssh://git@github.com/klappstuhlpy/klappstuhl_me-shared", tag = "v0.1.1" }
# rusqlite is pulled transitively by kls-web-core; declared directly (matching
# its version + bundled feature) so the migrate() signature and the DB init
# tests can name rusqlite::Connection. Feature unification keeps it one build.
reqwest = { version = "0.12.3", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tokio = { version = "1.36.0", features = ["rt-multi-thread", "net", "macros", "signal"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
