services:
  bot:
    container_name: percy
    build: .
    restart: unless-stopped

    env_file: .env

    # Helps debugging logs (optional but very useful)
    tty: true
    stdin_open: true

    # Ensure container uses same timezone as host (logs consistency)
    environment:
      PYTHONUNBUFFERED: "1"

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u, urllib.error as e\ntry: u.urlopen(\"http://localhost:8090/\", timeout=3)\nexcept e.HTTPError: pass" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

    networks:
      - homelab

networks:
  homelab:
    external: true
