services:
  bot:
    container_name: percy
    build: .
    restart: unless-stopped

    env_file: .env

    # Helps debugging logs (optional but very useful)
    tty: true
    stdin_open: true

    # Ensure container uses same timezone as host (logs consistency)
    environment:
      PYTHONUNBUFFERED: "1"

    ports:
      - "8090:8090"

    networks:
      - homelab

networks:
  homelab:
    external: true