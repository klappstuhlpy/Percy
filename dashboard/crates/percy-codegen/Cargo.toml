[package]
name = "percy-codegen"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Dev tool: generates crates/percy-client/src/generated.rs from the committed openapi.json (run via `cargo run -p percy-codegen`)."

# Versions are pinned exactly: a typify upgrade changes generated output, and that should be a
# deliberate, reviewable diff of generated.rs rather than a surprise.
[dependencies]
typify = "=0.8.0"
schemars = "=0.8.22"
serde_json = "1.0.114"
syn = "2"
prettyplease = "0.2"
