name: Dashboard

on:
  push:
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  api-contract:
    name: client/API contract
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ci-dummy-token
      DISCORD_BETA_TOKEN: ci-dummy-token
      INTERNAL_API_PORT: "8090"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - run: poetry install --no-interaction --no-root
      - run: poetry run pytest tests/test_api_contract.py
