# --- Discovery: sweeps in everything not hand-curated above ---
# Verified live against TMDB on 2026-08-14 (v4 read token from .env, never committed).

[[discover]]
kind = "movie"
# Marvel Studios -- verified via GET /company/420 -> name "Marvel Studios"
company = 420
era = "extras"
importance = "optional"
# Iron Man's release: excludes the pre-MCU Marvel-licensed films (2007 Sony/Fox/animated
# titles) this company id also carries from Marvel's pre-Marvel Studios licensing days.
min_date = "2008-01-01"
# Confirmed non-MCU survivors of the date filter (checked each via GET /movie/{id}):
#  13056  Punisher: War Zone (2008) -- Lionsgate/Marvel Knights, not an MCU film
#  15257  Hulk Vs. Wolverine (2009) -- Lionsgate/Marvel Animation, pre-MCU
#  101907 Hulk Vs. Thor (2009) -- Lionsgate/Marvel Animation, pre-MCU
#  14613  Next Avengers: Heroes of Tomorrow (2008) -- Lionsgate/Marvel Animation, pre-MCU
#  1275606 Marvel Studios Assembled: The Making of X-Men '97 (2024) -- about a Marvel
#          Animation show, not an MCU release
#  717082 Stan Lee (2023) -- biographical documentary, not an MCU release
exclude = [13056, 15257, 101907, 14613, 1275606, 717082]

[[discover]]
kind = "tv"
# "marvel cinematic universe (mcu)" keyword -- verified via GET /keyword/180547
# Covers the Marvel Television era (Agents of S.H.I.E.L.D., Agent Carter, Inhumans, the
# Netflix Defenders shows, Runaways, Cloak & Dagger, Helstrom) and every Disney+ series.
keyword = 180547
era = "television"
importance = "optional"
