# all -- it is a solid red rectangle that stamps itself onto the backdrop instead of sitting
# in it -- and Marvel Studios' (company 420) knocks "MARVEL" out of the brick and sets
# "STUDIOS" in flat black, so both halves go dark-on-dark. This one's brushed-metal gradient
# carries light and dark values at once, so it reads on either theme.
