# --- Discovery: everything above is curated; these two queries fill in the long tail ---
# Verified live against TMDB on 2026-08-17 (v4 read token from .env, never committed).
#
# Read this before adding to either block. A TMDB company or keyword query returns a studio's
# *entire* catalogued output, and Marvel Studios' output includes its own promotional material:
# "Marvel Studios Assembled" making-ofs, "Legends" recap episodes, anniversary documentaries,
# LEGO tie-ins, preschool spin-off shorts, and individual animated shorts double-filed as
# movies. A watch order is for releases, so all of that is denied below by id.
#
# **There is no clean TMDB handle that separates a franchise's releases from its behind-the-
# scenes output.** That was checked: no genre, keyword, company or date filter draws the line
# (the documentaries carry the same company id, and several BTS rows are not even tagged
# Documentary -- 1010823 "Magnum Opus" is an animated short). So `exclude` is a **maintained
# deny-list, and it will never be complete**: every new making-of Marvel ships will sweep in on
# the next sync until someone adds its id here. Treat it as a chore with each sync, not as a
# guarantee this file already gives you. It is not exhaustive and cannot be made exhaustive.

[[discover]]
kind = "movie"
# Marvel Studios -- verified via GET /company/420 -> name "Marvel Studios"
company = 420
era = "extras"
importance = "optional"
# Iron Man's release: excludes the pre-MCU Marvel-licensed films (2007 Sony/Fox/animated
# titles) this company id also carries from Marvel's pre-Marvel Studios licensing days.
min_date = "2008-01-01"
# Every id below was confirmed by GET /movie/{id} on 2026-08-17; the title and date the API
# returned are what the comment says. Grouped by why it is denied, so a future editor can see
# which category a new arrival belongs to -- and can see that each category is open-ended.
exclude = [
  # Marvel-licensed, pre-Marvel-Studios films the min_date could not filter out
  13056,    # Punisher: War Zone (2008) -- Lionsgate/Marvel Knights
  15257,    # Hulk vs. Wolverine (2009) -- Lionsgate/Marvel Animation
  101907,   # Hulk vs. Thor (2009) -- Lionsgate/Marvel Animation
  14613,    # Next Avengers: Heroes of Tomorrow (2008) -- Lionsgate/Marvel Animation
  # "Marvel Studios Assembled" making-ofs. One ships per production, so this list grows.
  936643,   # ... The Making of Hawkeye (2022)
  939356,   # ... The Making of Eternals (2022)
  964943,   # ... The Making of Moon Knight (2022)
  980017,   # ... The Making of Doctor Strange in the Multiverse of Madness (2022)
  1001912,  # ... The Making of Ms. Marvel (2022)
  1015595,  # ... The Making of Thor: Love and Thunder (2022)
  1026208,  # ... The Making of She-Hulk: Attorney at Law (2022)
  1076032,  # ... The Making of Black Panther: Wakanda Forever (2023)
  1127361,  # ... The Making of Ant-Man and the Wasp: Quantumania (2023)
  1165487,  # ... The Making of the Guardians of the Galaxy Vol. 3 (2023)
  1165500,  # ... The Making of Secret Invasion (2023)
  1192825,  # ... The Making of Loki Season 2 (2023)
  1220337,  # ... The Making of Echo (2024)
  1235525,  # ... The Making of The Marvels (2024)
  1275606,  # ... The Making of X-Men '97 (2024) -- and X-Men '97 is not MCU canon either
  1386628,  # ... The Making of Deadpool & Wolverine (2024)
  1387507,  # ... The Making of Agatha All Along (2024)
  # Documentaries and promotional specials about the MCU rather than part of it
  259910,   # Marvel Studios: Assembling a Universe (2014)
  379040,   # Marvel's Captain America: 75 Heroic Years (2016)
  647375,   # Marvel Studios: Expanding the Universe (2019)
  877188,   # Marvel Studios' 2021 Disney+ Day Special (2021)
  979160,   # A Fan's Guide to Ms. Marvel (2022)
  1036996,  # Director by Night (2022) -- about Sam Raimi's Multiverse of Madness shoot
  717082,   # Stan Lee (2023) -- biographical documentary
  # LEGO tie-ins: a separate, non-canon comedic continuity
  1154598,  # LEGO Marvel Avengers: Code Red (2023)
  1359227,  # LEGO Marvel Avengers: Mission Demolition (2024)
  # Episodes of the preschool spin-off "Marvel's Spidey and His Amazing Friends", not MCU
  1564058,  # Spidey and Iron Man: Avengers Team Up! (2025)
  1750432,  # Spidey and the Avengers: Halloween Team-Up! (2026)
  # The five "I Am Groot" shorts, each double-filed as a movie -- they duplicate tv:232125,
  # which is the series and is already in the catalogue. Note 1010823 carries no Documentary
  # genre: a genre filter would not have caught it, which is the whole argument above.
  1010818,  # Groot's First Steps (2022)
  1010819,  # The Little Guy (2022)
  1010820,  # Groot's Pursuit (2022)
  1010821,  # Groot Takes a Bath (2022)
  1010823,  # Magnum Opus (2022)
]

[[discover]]
kind = "tv"
# "marvel cinematic universe (mcu)" keyword -- verified via GET /keyword/180547
# What it returns is whatever TMDB contributors have tagged, which is most of the Marvel
# Television era (Agents of S.H.I.E.L.D., Agent Carter, Inhumans, the Netflix Defenders shows,
# Runaways, Cloak & Dagger, Helstrom) and most of the Disney+ slate -- but it is a
# community-maintained tag, not a manifest. It misses shows (Your Friendly Neighborhood
# Spider-Man and The Daily Bugle are curated above because of it) and it admits documentary
# series. Do not read this block as coverage of "every" MCU show.
keyword = 180547
era = "television"
importance = "optional"
